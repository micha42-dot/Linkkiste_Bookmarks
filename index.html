<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="description" content="A minimalist, personal bookmarking tool inspired by early del.icio.us. Private, fast, and tag-based." />
    <meta property="og:title" content="LinkKiste" />
    <meta property="og:description" content="A minimalist, personal bookmarking tool inspired by early del.icio.us. Private, fast, and tag-based." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3274D1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/3274D1/FFFFFF.png?text=LK">
    <title>LinkKiste</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'del-blue': '#3274D1', // The classic Delicious Blue
              'del-dark-blue': '#245dc1',
              'del-link': '#3274D1',
              'del-gray': '#999999',
              'del-green': '#86C944', // The classic Delicious Green
              'del-bg-header': '#ffffff',
              'del-nav-bg': '#f0f0f0',
              'del-border': '#CCCCCC',
              'retro-blue': '#3274D1'
            },
            fontFamily: {
              'retro': ['Arial', 'Helvetica', 'sans-serif'],
              'arial': ['Arial', 'Helvetica', 'sans-serif'],
            },
            fontSize: {
              'xxs': '0.65rem',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFFFFF;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        color: #333;
        line-height: 1.4;
        /* Prevent pull-to-refresh on mobile which feels web-like */
        overscroll-behavior-y: none;
      }
      a { color: #3274D1; text-decoration: none; }
      a:hover { text-decoration: underline; }
      a.no-underline, a.no-underline:hover, a.no-underline *, .no-underline, .no-underline * { text-decoration: none !important; }
      
      /* Subtle offset floating animation for LinkKiste logo squares on hover */
      @keyframes logoBobSquare1 {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes logoBobSquare2 {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(4px);
        }
      }

      .group:hover .logo-square-1 {
        animation: logoBobSquare1 1.8s ease-in-out infinite;
      }

      .group:hover .logo-square-2 {
        animation: logoBobSquare2 1.8s ease-in-out infinite 0.35s;
      }

      button { 
        cursor: pointer; 
        touch-action: manipulation; /* Prevents double-tap to zoom */
      }
      input[type="checkbox"] { cursor: pointer; }
      .tag-cloud-item:hover { text-decoration: underline; color: #3274D1; }

      /* Utility to truly hide scrollbars while allowing scroll */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Clean Web 2.0 / Delicious Era Flat Button & Header Styles (No 3D / No glossy gradients) */
      .web2-btn {
        background: #F4F4F4;
        border: 1px solid #CCCCCC;
        color: #333333;
      }
      .web2-btn:hover {
        background: #EAEAEA;
        border-color: #AAAAAA;
      }
      .web2-btn:active {
        background: #DFDFDF;
      }

      .web2-btn-blue {
        background: #3274D1;
        border: 1px solid #255CB0;
        color: #FFFFFF !important;
      }
      .web2-btn-blue:hover {
        background: #205CB0;
      }
      .web2-btn-blue:active {
        background: #18478C;
      }

      .web2-btn-green {
        background: #86C944;
        border: 1px solid #71B034;
        color: #FFFFFF !important;
      }
      .web2-btn-green:hover {
        background: #76B736;
      }
      .web2-btn-green:active {
        background: #5E9429;
      }

      .web2-panel-header {
        background: #F0F4FA;
        border-bottom: 1px solid #D8E2F0;
      }

      .web2-input {
        background-color: #FFFFFF;
        border: 1px solid #CCCCCC;
      }
      .web2-input:focus {
        border-color: #3274D1;
        outline: none;
      }

      /* Prevent iOS zoom on inputs by enforcing 16px on small screens */
      @media screen and (max-width: 768px) {
        input, textarea, select {
          font-size: 16px !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <!-- Error Trap for White Screen of Death -->
    <script>
      window.addEventListener('error', function(e) {
        // Ignorieren von ResizeObserver Fehlern, die oft harmlos sind
        if (e.message && (e.message.includes('ResizeObserver') || e.message.includes('lockdown'))) return;
        
        console.error("Global Error:", e);
        var root = document.getElementById('root');
        
        // Only show full screen error if the app hasn't loaded (root still says "loading" or is empty)
        if (root && (!root.innerText || root.innerText.trim() === '')) {
           var errorHtml = '<div style="padding:40px; font-family:sans-serif; color:#333; text-align:center; max-width:600px; margin:0 auto; line-height:1.6;">';
           errorHtml += '<h3 style="margin-bottom:10px; color:#d32f2f;">Die App konnte nicht starten</h3>';
           errorHtml += '<p style="margin-bottom:20px;">Ein unerwarteter Fehler ist aufgetreten.</p>';
           errorHtml += '<div style="background:#f5f5f5; padding:10px; border-radius:4px; font-family:monospace; font-size:11px; text-align:left; overflow:auto; margin-bottom:20px;">' + (e.message || "Unknown Error") + '</div>';
           errorHtml += '<button onclick="window.location.reload(true)" style="padding:10px 20px; background:#3274D1; color:white; border:none; border-radius:4px; cursor:pointer;">Neu laden</button>';
           errorHtml += '</div>';
           root.innerHTML = errorHtml;
        }
      });
    </script>
  </body>
</html>
